# Filtro de Fail2ban para el escenario E2 (escaneo / enumeración web).
# Se instala en /etc/fail2ban/filter.d/centinela-escaneo-web.conf
#
# Cuenta las peticiones al servidor Apache que terminan en error de cliente
# (400, 401, 403, 404, 405). Herramientas como Gobuster o Nikto generan cientos
# de estas respuestas en segundos; un usuario normal, muy pocas.

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "[A-Z]+ [^"]*" (?:400|401|403|404|405) \S+
ignoreregex =
