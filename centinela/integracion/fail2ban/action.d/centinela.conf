# Acción de Fail2ban que entrega cada baneo a Centinela.
# Se instala en /etc/fail2ban/action.d/centinela.conf
#
# Fail2ban sigue haciendo la contención (iptables); esta acción solo agrega
# la notificación: clasificación ANCI, alerta temprana en PDF y control de plazos.

[Definition]
actionstart =
actionstop =
actioncheck =
# Se ejecuta en segundo plano para no retrasar el bloqueo.
actionban = /usr/local/bin/centinela ban --ip <ip> --jail <name> >> /var/log/centinela.log 2>&1 &
actionunban =

[Init]
